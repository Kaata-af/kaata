<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width={{WIDTH}}" />
    <title>Kaata — social artwork template</title>
    <style>
      @font-face { font-family: Vazirmatn; font-weight: 400; src: url(data:font/woff2;base64,{{VAZIR_AR_400}}); unicode-range: U+0600-06FF,U+200C-200E; }
      @font-face { font-family: Vazirmatn; font-weight: 700; src: url(data:font/woff2;base64,{{VAZIR_AR_700}}); unicode-range: U+0600-06FF,U+200C-200E; }
      @font-face { font-family: Vazirmatn; font-weight: 400; src: url(data:font/woff2;base64,{{VAZIR_LA_400}}); unicode-range: U+0000-00FF,U+2000-206F; }
      @font-face { font-family: Vazirmatn; font-weight: 700; src: url(data:font/woff2;base64,{{VAZIR_LA_700}}); unicode-range: U+0000-00FF,U+2000-206F; }
      :root {
        --brand: {{BRAND_AUBERGINE}};
        --highlight: {{BRAND_SAFFRON}};
        --warm: {{BRAND_IVORY}};
        --ink: {{BRAND_CHARCOAL}};
        --white: {{BRAND_WHITE}};
      }
      * { box-sizing: border-box; }
      body { margin: 0; width: {{WIDTH}}px; height: {{HEIGHT}}px; background: var(--highlight); color: var(--ink); font-family: Vazirmatn, sans-serif; }
      .canvas { width: 100%; height: 100%; padding: 84px; display: flex; flex-direction: column; gap: 64px; }
      .brand { display: flex; align-items: center; gap: 24px; color: var(--brand); font-size: 62px; font-weight: 700; }
      /* logo.png is already Aubergine (marketing/recolor_logo.py). */
      .brandmark { width: 88px; height: 88px; display: inline-flex; overflow: hidden; border-radius: 22%; background: var(--brand); }
      .brandmark img { width: 100%; height: 100%; }
      .message { margin-block: auto; padding: 64px; background: var(--warm); border-radius: 48px; }
      h1 { margin: 0; font-size: 76px; font-weight: 700; line-height: 1.5; color: var(--brand); }
      p { margin: 36px 0 0; font-size: 36px; line-height: 1.8; }
      .details { display: inline-block; margin-top: 40px; padding: 18px 28px; border-radius: 20px; background: var(--white); font-size: 30px; }
      .footer { display: flex; align-items: center; justify-content: space-between; gap: 24px; font-size: 30px; }
      .cta { padding: 20px 32px; background: var(--brand); color: var(--white); border-radius: 20px; font-weight: 700; }
      .square .canvas { padding: 64px; gap: 32px; }
      .square .message { padding: 48px; }
      .square h1 { font-size: 62px; }
      .square p { margin-top: 24px; font-size: 30px; }
      .square .details { margin-top: 28px; font-size: 24px; }
      .square .footer { font-size: 26px; }
      .square .cta { padding: 16px 24px; }
      /* Stories: Instagram, Facebook and WhatsApp Status draw their own UI over
         about the top 250px and bottom 340px of 1080x1920. The Saffron field
         stays full-bleed; the logo, copy and CTA stay between those bands. */
      .story .canvas { padding: 280px 84px 370px; }
    </style>
  </head>
  <body class="{{FORMAT}}">
    <!-- Edit copy here, then rebuild locally. This template contains no
         private ledger screenshots, phone numbers or customer information. -->
    <main class="canvas">
      <div class="brand">
        <span class="brandmark"><img src="data:image/png;base64,{{LOGO}}" alt="" /></span>
        <span>کاتا.</span>
      </div>
      <div class="message">
        <h1>حساب و کتاب دکان،<br />روی تلفون شما.</h1>
        <p>بنویسید کی چقدر قرض دارد — روی تلفون، نه روی کاغذ.</p>
        <div class="details">یادآوری مشتری‌ها در واتساپ</div>
      </div>
      <div class="footer">
        <span class="cta">کاتا را دانلود کنید</span><span dir="ltr">kaata.af</span>
      </div>
    </main>
  </body>
</html>
