<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kaata — A quiet ledger between you and the people you trust.</title>
    <meta
      name="description"
      content="Kaata is a digital kaata book. Track what people owe you and what you owe them. Send a friendly reminder over WhatsApp in two taps. Works offline."
    />
    <meta name="theme-color" content="#ffffff" />
    <!-- Force a light render even on dark-mode phones. The `only` keyword is
         what disables Chrome's Auto Dark Theme for Web Contents, which otherwise
         algorithmically darkens our white #ffffff page on Android dark mode.
         Plain `light` is not always enough — `only light` is the documented
         opt-out. Mirrored in CSS (globals.css) belt-and-suspenders. -->
    <meta name="color-scheme" content="only light" />
    <!-- Open Graph — the kaata.af growth loop is people sharing the link on
         WhatsApp; without these tags the preview card renders bare. og:image
         must be an absolute URL or WhatsApp ignores it. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kaata" />
    <meta
      property="og:title"
      content="Kaata — A quiet ledger between you and the people you trust."
    />
    <meta
      property="og:description"
      content="Track what people owe you and what you owe them. Send a friendly reminder over WhatsApp in two taps. Works offline. Free forever."
    />
    <meta property="og:url" content="https://kaata.af/" />
    <meta property="og:image" content="https://kaata.af/logo.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Kaata logo" />
    <link rel="canonical" href="https://kaata.af/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="fa_AF" />
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Kaata — A quiet ledger between you and the people you trust."
    />
    <meta
      name="twitter:description"
      content="Track what people owe you and what you owe them. Works offline. Free forever."
    />
    <meta name="twitter:image" content="https://kaata.af/logo.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Organization schema — the `sameAs` links tell search engines that these
         social profiles belong to the Kaata brand (mirrored in the footer and
         src/env.ts). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Kaata",
        "url": "https://kaata.af/",
        "logo": "https://kaata.af/logo.png",
        "sameAs": [
          "https://www.facebook.com/kaata.af",
          "https://www.instagram.com/kaata.af",
          "https://www.tiktok.com/@kaata.af",
          "https://apps.apple.com/us/app/kaata/id6789651127",
          "https://play.google.com/store/apps/details?id=af.kaata.app"
        ]
      }
    </script>
    <!-- Fonts are self-hosted (Fontsource, bundled by Vite) — no external
         font request can block or fail this page on slow networks. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
