plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'af.kaata.savefile'
version = '0.0.1'

android {
  namespace 'expo.modules.kaatasavefile'
  defaultConfig {
    versionCode 1
    versionName '0.0.1'
  }
}

dependencies {
  // MediaStore + ContentResolver ship in the Android platform SDK.
  // expo-modules-core comes transitively via the expo-module-gradle-plugin.
  // Deliberately nothing else: this module is a single stream copy.
}
