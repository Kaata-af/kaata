plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'af.kaata.btclassic'
version = '0.0.1'

android {
  namespace 'expo.modules.kaatabtclassic'
  defaultConfig {
    versionCode 1
    versionName '0.0.1'
  }
}

dependencies {
  // BluetoothAdapter / BluetoothServerSocket / RFCOMM ship in the Android
  // platform SDK. expo-modules-core comes transitively via the
  // expo-module-gradle-plugin.
  //
  // NOTE: no direct com.facebook.react dependency. KaataMeshHeadlessService
  // (deleted 2026-08-08 with the mesh cleanup) was the only class here that
  // touched React Native internals — HeadlessJsTaskService / Arguments /
  // HeadlessJsTaskConfig — and those are exactly the APIs that move under
  // bridgeless. Keep it that way: this module should depend on the Android
  // platform + expo-modules-core only.

  // Native mesh engine (Briar-parity rewrite): crypto that must match the JS
  // protocol byte-for-byte — Ed25519 (identity), X25519 (ECDH), HKDF-SHA512
  // (session key), ChaCha20-Poly1305 IETF (frame AEAD). BouncyCastle's
  // lightweight low-level API (org.bouncycastle.crypto.*) is used DIRECTLY (no
  // JCE provider registration → no clash with Android's bundled BC), and it
  // ships every primitive @noble uses on the JS side, including RFC-5869 HKDF.
  //
  // MUST be the -jdk15to18 variant, NOT -jdk18on: the app's release classpath
  // ALREADY pulls bcprov-jdk15to18:1.78.1 transitively (via bcpkix). Both
  // variants contain identical org.bouncycastle.* classes, so adding -jdk18on
  // produced a duplicate-class dexing failure in the full app build. Declaring
  // the SAME coordinates as the existing transitive dep dedupes to one artifact.
  implementation 'org.bouncycastle:bcprov-jdk15to18:1.78.1'

  // Unit tests: cross-language parity vectors prove the native crypto +
  // canonicalization match the JS byte-for-byte. org.json is stubbed in Android
  // unit tests, so pull the real impl; base64 is now pure-Kotlin (MeshBase64) so
  // no Robolectric is needed.
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20231013'
}
