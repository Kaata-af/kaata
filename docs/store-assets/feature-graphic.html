<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Vaz";
    font-weight: 900;
    src: url("file:///C:/Users/Matee/Desktop/Projects/Kaata/kaata/apps/mobile/node_modules/@expo-google-fonts/vazirmatn/900Black/Vazirmatn_900Black.ttf");
  }
  @font-face {
    font-family: "Vaz";
    font-weight: 700;
    src: url("file:///C:/Users/Matee/Desktop/Projects/Kaata/kaata/apps/mobile/node_modules/@expo-google-fonts/vazirmatn/700Bold/Vazirmatn_700Bold.ttf");
  }
  @font-face {
    font-family: "Vaz";
    font-weight: 500;
    src: url("file:///C:/Users/Matee/Desktop/Projects/Kaata/kaata/apps/mobile/node_modules/@expo-google-fonts/vazirmatn/500Medium/Vazirmatn_500Medium.ttf");
  }
  @font-face {
    font-family: "Mono";
    font-weight: 800;
    src: url("file:///C:/Users/Matee/Desktop/Projects/Kaata/kaata/apps/mobile/node_modules/@expo-google-fonts/jetbrains-mono/800ExtraBold/JetBrainsMono_800ExtraBold.ttf");
  }
  @font-face {
    font-family: "Mono";
    font-weight: 600;
    src: url("file:///C:/Users/Matee/Desktop/Projects/Kaata/kaata/apps/mobile/node_modules/@expo-google-fonts/jetbrains-mono/600SemiBold/JetBrainsMono_600SemiBold.ttf");
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; }
  .stage {
    width: 1024px; height: 500px; position: relative; overflow: hidden;
    background:
      radial-gradient(120% 140% at 18% 8%, #1c1c1c 0%, #0c0c0c 42%, #000 78%);
    font-family: "Vaz", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* faint texture rule lines, like a ledger, very subtle */
  .grain {
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(
      to bottom, rgba(255,255,255,0.018) 0 1px, transparent 1px 46px);
    mask-image: linear-gradient(to right, #000 0%, transparent 62%);
    -webkit-mask-image: linear-gradient(to right, #000 0%, transparent 62%);
  }

  .left { position: absolute; left: 76px; top: 0; height: 500px;
          display: flex; flex-direction: column; justify-content: center; width: 560px; }

  .brandrow { display: flex; align-items: center; gap: 22px; }
  .mark { width: 92px; height: 92px; overflow: hidden; flex: none;
          filter: drop-shadow(0 6px 26px rgba(255,255,255,0.10)); }
  .mark img { width: 210px; height: 210px; margin: -59px 0 0 -59px; display: block; }

  .wordmark { font-weight: 900; font-size: 96px; color: #fff;
              letter-spacing: -4px; line-height: 0.9; }
  .wordmark .dot { color: #14B981; }

  .tagline { margin-top: 30px; font-weight: 700; font-size: 34px;
             color: #f2f2f2; letter-spacing: -0.5px; line-height: 1.18; }
  .tagline .soft { color: #8f8f8f; font-weight: 500; }

  .meta { margin-top: 26px; font-family: "Mono", monospace; font-weight: 600;
          font-size: 15px; color: #6f6f6f; letter-spacing: 1.5px; }
  .meta .sep { color: #14B981; padding: 0 8px; }

  /* product card floating on the right */
  .card {
    position: absolute; right: 74px; top: 50%;
    transform: translateY(-50%) rotate(-3deg);
    width: 316px; background: #fff; border-radius: 26px;
    padding: 30px 30px 26px; box-shadow: 0 34px 80px rgba(0,0,0,0.55), 0 6px 18px rgba(0,0,0,0.4);
  }
  .card .lbl { font-family: "Mono", monospace; font-weight: 600; font-size: 13px;
               letter-spacing: 2px; color: #0C745A; text-transform: uppercase; }
  .card .total { margin-top: 8px; font-family: "Mono", monospace; font-weight: 800;
                 font-size: 46px; color: #12100F; letter-spacing: -1px;
                 direction: ltr; unicode-bidi: isolate; }
  .card .sub { margin-top: 6px; font-weight: 500; font-size: 15px; color: #8a8a8a; }
  .card .rule { height: 1px; background: #EDEDED; margin: 18px -30px 4px; }
  .row { display: flex; align-items: center; padding: 15px 0; }
  .row + .row { border-top: 1px solid #F4F4F4; }
  .avatar { width: 40px; height: 40px; border-radius: 999px; flex: none;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 17px; color: #fff; }
  .a1 { background: #0C745A; } .a2 { background: #A3203A; }
  .who { margin-left: 14px; }
  .who .nm { font-weight: 700; font-size: 18px; color: #171717; }
  .who .st { font-weight: 500; font-size: 13px; color: #9a9a9a; margin-top: 1px; }
  .amt { margin-left: auto; font-family: "Mono", monospace; font-weight: 800; font-size: 18px;
         direction: ltr; unicode-bidi: isolate; }
  .collect { color: #0C745A; } .pay { color: #A3203A; }
</style>
</head>
<body>
  <div class="stage">
    <div class="grain"></div>

    <div class="left">
      <div class="brandrow">
        <div class="mark"><img src="file:///C:/Users/Matee/Desktop/Projects/Kaata/kaata/apps/mobile/assets/android-icon-foreground.png" /></div>
        <div class="wordmark">kaata<span class="dot">.</span></div>
      </div>
      <div class="tagline">Your shop's ledger,<br><span class="soft">in your pocket.</span></div>
      <div class="meta">TRACK WHO OWES YOU<span class="sep">•</span>OFFLINE<span class="sep">•</span>FREE</div>
    </div>

    <div class="card">
      <div class="lbl">To collect</div>
      <div class="total">25,850 ؋</div>
      <div class="sub">from 4 people</div>
      <div class="rule"></div>
      <div class="row">
        <div class="avatar a1">A</div>
        <div class="who"><div class="nm">Ahmad Wali</div><div class="st">To collect</div></div>
        <div class="amt collect">12,500 ؋</div>
      </div>
      <div class="row">
        <div class="avatar a1">G</div>
        <div class="who"><div class="nm">Gul Rahman</div><div class="st">To collect</div></div>
        <div class="amt collect">8,750 ؋</div>
      </div>
    </div>
  </div>
</body>
</html>
