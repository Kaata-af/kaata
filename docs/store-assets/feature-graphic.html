<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Play feature graphic, 1024x500. Brand roles per docs/brand-language.md:
         Aubergine identity field, the original white K (the Android adaptive
         foreground, so its exact shape), Saffron accents, and a white reading
         card drawn like the app's neutral ledger rows. Paths are relative to
         this file; render with headless Chrome (see docs/store-listing.md). -->
    <style>
      @font-face {
        font-family: "Vaz";
        font-weight: 900;
        src: url("../../apps/mobile/node_modules/@expo-google-fonts/vazirmatn/900Black/Vazirmatn_900Black.ttf");
      }
      @font-face {
        font-family: "Vaz";
        font-weight: 700;
        src: url("../../apps/mobile/node_modules/@expo-google-fonts/vazirmatn/700Bold/Vazirmatn_700Bold.ttf");
      }
      @font-face {
        font-family: "Vaz";
        font-weight: 600;
        src: url("../../apps/mobile/node_modules/@expo-google-fonts/vazirmatn/600SemiBold/Vazirmatn_600SemiBold.ttf");
      }
      @font-face {
        font-family: "Vaz";
        font-weight: 400;
        src: url("../../apps/mobile/node_modules/@expo-google-fonts/vazirmatn/400Regular/Vazirmatn_400Regular.ttf");
      }
      @font-face {
        font-family: "Mono";
        font-weight: 700;
        src: url("../../apps/mobile/node_modules/@expo-google-fonts/jetbrains-mono/700Bold/JetBrainsMono_700Bold.ttf");
      }
      @font-face {
        font-family: "Mono";
        font-weight: 600;
        src: url("../../apps/mobile/node_modules/@expo-google-fonts/jetbrains-mono/600SemiBold/JetBrainsMono_600SemiBold.ttf");
      }
      /* apps/_shared/brand-palette.json + the app's ledger colors. */
      :root {
        --aubergine: #4a2a50;
        --saffron: #ecb84a;
        --ivory: #f9f2e7;
        --charcoal: #29222b;
        --white: #ffffff;
        --text-emphasis: #171717;
        --text-subtle: #616161;
        --text-muted: #6b6b6b;
        --border: #e2e2e2;
        --collect-bg: #e8f4ef;
        --collect-strong: #0c745a;
        --pay-bg: #f8eaec;
        --pay-strong: #a3203a;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1024px;
        height: 500px;
      }
      .stage {
        width: 1024px;
        height: 500px;
        position: relative;
        overflow: hidden;
        background:
          radial-gradient(90% 120% at 16% 10%, #5a3561 0%, rgba(90, 53, 97, 0) 60%),
          var(--aubergine);
        font-family: "Vaz", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      /* faint ledger rule lines on the left half */
      .grain {
        position: absolute;
        inset: 0;
        background-image: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.035) 0 1px,
          transparent 1px 46px
        );
        mask-image: linear-gradient(to right, #000 0%, transparent 62%);
        -webkit-mask-image: linear-gradient(to right, #000 0%, transparent 62%);
      }

      .left {
        position: absolute;
        left: 76px;
        top: 0;
        height: 500px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        width: 560px;
      }

      .brandrow {
        display: flex;
        align-items: center;
        gap: 22px;
      }
      /* The adaptive-icon foreground is the white K on transparency, so the
         Aubergine field shows through exactly as on the launcher. */
      .mark {
        width: 92px;
        height: 92px;
        overflow: hidden;
        flex: none;
      }
      .mark img {
        width: 210px;
        height: 210px;
        margin: -59px 0 0 -59px;
        display: block;
      }

      .wordmark {
        font-weight: 900;
        font-size: 96px;
        color: var(--white);
        letter-spacing: -4px;
        line-height: 0.9;
      }
      .wordmark .dot {
        color: var(--saffron);
      }

      .tagline {
        margin-top: 30px;
        font-weight: 700;
        font-size: 34px;
        color: var(--white);
        letter-spacing: -0.5px;
        line-height: 1.18;
      }
      .tagline .accent {
        color: var(--saffron);
      }

      .meta {
        margin-top: 26px;
        font-family: "Mono", monospace;
        font-weight: 600;
        font-size: 15px;
        color: rgba(249, 242, 231, 0.72);
        letter-spacing: 1.5px;
      }
      .meta .sep {
        color: var(--saffron);
        padding: 0 8px;
      }

      /* Product card: the app's white reading surface and neutral rows. */
      .card {
        position: absolute;
        right: 74px;
        top: 50%;
        transform: translateY(-50%) rotate(-3deg);
        width: 316px;
        background: var(--white);
        border-radius: 26px;
        padding: 30px 30px 24px;
        box-shadow:
          0 34px 80px rgba(20, 8, 23, 0.55),
          0 6px 18px rgba(20, 8, 23, 0.35);
      }
      .card .lbl {
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 1px;
        color: var(--text-subtle);
        text-transform: uppercase;
      }
      .card .total {
        margin-top: 6px;
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .card .total .num {
        font-family: "Mono", monospace;
        font-weight: 700;
        font-size: 46px;
        color: var(--collect-strong);
        letter-spacing: -1px;
      }
      .card .total .afn {
        font-weight: 600;
        font-size: 18px;
        color: var(--text-muted);
      }
      .card .rule {
        height: 1px;
        background: var(--border);
        margin: 18px -30px 4px;
      }
      .row {
        display: flex;
        align-items: center;
        padding: 14px 0;
      }
      .row + .row {
        border-top: 1px solid var(--border);
      }
      .tile {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .tile.pay {
        background: var(--pay-bg);
        color: var(--pay-strong);
      }
      .tile.collect {
        background: var(--collect-bg);
        color: var(--collect-strong);
      }
      .who {
        margin-left: 14px;
      }
      .who .nm {
        font-weight: 700;
        font-size: 18px;
        color: var(--text-emphasis);
      }
      .who .st {
        font-weight: 400;
        font-size: 13px;
        color: var(--text-subtle);
        margin-top: 1px;
      }
      .amt {
        margin-left: auto;
        display: flex;
        align-items: baseline;
        gap: 4px;
      }
      .amt .num {
        font-family: "Mono", monospace;
        font-weight: 700;
        font-size: 18px;
        color: var(--text-emphasis);
      }
      .amt .afn {
        font-weight: 600;
        font-size: 12px;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="grain"></div>

      <div class="left">
        <div class="brandrow">
          <div class="mark">
            <img src="../../apps/mobile/assets/android-icon-foreground.png" alt="" />
          </div>
          <div class="wordmark">kaata<span class="dot">.</span></div>
        </div>
        <div class="tagline">
          Your shop's ledger,<br /><span class="accent">in your pocket.</span>
        </div>
        <div class="meta">
          TRACK WHO OWES YOU<span class="sep">•</span>OFFLINE<span class="sep">•</span>FREE
        </div>
      </div>

      <!-- 35,000 given − 9,150 received = 25,850 to collect. -->
      <div class="card">
        <div class="lbl">To collect</div>
        <div class="total"><span class="num">25,850</span><span class="afn">؋</span></div>
        <div class="rule"></div>
        <div class="row">
          <div class="tile pay">
            <svg
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="12" y1="19" x2="12" y2="6" />
              <polyline points="6 12 12 6 18 12" />
            </svg>
          </div>
          <div class="who">
            <div class="nm">I gave</div>
            <div class="st">Flour &amp; cooking oil</div>
          </div>
          <div class="amt"><span class="num">35,000</span><span class="afn">؋</span></div>
        </div>
        <div class="row">
          <div class="tile collect">
            <svg
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="12" y1="5" x2="12" y2="18" />
              <polyline points="6 12 12 18 18 12" />
            </svg>
          </div>
          <div class="who">
            <div class="nm">I received</div>
            <div class="st">Part payment</div>
          </div>
          <div class="amt"><span class="num">9,150</span><span class="afn">؋</span></div>
        </div>
      </div>
    </div>
  </body>
</html>
